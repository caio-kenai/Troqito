name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Formatação
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test -- --ci

      # O build de debug carrega o JavaScript do Metro e nunca empacota nada,
      # então erros de resolução do empacotador só apareciam no release. Este
      # passo empacota de fato, em cerca de um minuto.
      - name: Empacotar o JavaScript
        run: npx expo export --platform android --output-dir dist-check
        env:
          EXPO_PUBLIC_APP_STAGE: preview

  # A compilação nativa leva cerca de vinte minutos e só quebra quando muda
  # dependência ou configuração nativa — mudança de TypeScript não a afeta.
  # Por isso ela roda sempre na main, e nos Pull Requests apenas quando algo
  # que possa afetá-la for alterado.
  native-changed:
    name: Verificar alterações nativas
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            native:
              - 'package.json'
              - 'package-lock.json'
              - 'app.config.ts'
              - '.github/workflows/**'
              - 'assets/**'

  build:
    name: Validar build Android
    runs-on: ubuntu-latest
    needs: [quality, native-changed]
    if: >-
      github.event_name == 'push' ||
      needs.native-changed.outputs.changed == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Gerar projeto nativo
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_APP_STAGE: preview

      - uses: gradle/actions/setup-gradle@v4

      # Valida que o projeto nativo compila sem exigir keystore de produção,
      # que nunca é exposto ao workflow.
      - name: Compilar variante de debug
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android
