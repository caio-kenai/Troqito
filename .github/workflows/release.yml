name: Release

on:
  push:
    tags: ['v*']
  # Permite gerar um APK de teste sem criar uma versão.
  workflow_dispatch:
    inputs:
      stage:
        description: Estágio do build
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: write

jobs:
  android:
    name: Gerar APK e AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Verificar qualidade
        run: |
          npm run lint
          npm run typecheck
          npm test -- --ci

      # Uma tag com hífen é pré-lançamento pelo SemVer (`v0.1.0-preview.1`).
      # Ela compila no estágio de pré-visualização, com identificador de pacote
      # próprio, para não ocupar o do aplicativo final nem substituí-lo no
      # aparelho de quem já tiver a versão estável instalada.
      - name: Definir estágio
        id: stage
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "value=${{ inputs.stage }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME#*-}" != "$GITHUB_REF_NAME" ]; then
            echo "value=preview" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=production" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar projeto nativo
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_APP_STAGE: ${{ steps.stage.outputs.value }}

      - uses: gradle/actions/setup-gradle@v4

      # Sem keystore de produção configurado, o Gradle assina o release com a
      # chave de depuração. O APK instala e roda, mas não serve para publicação
      # na Google Play. A assinatura real entra quando houver keystore.
      - name: Compilar APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: android
        env:
          EXPO_PUBLIC_APP_STAGE: ${{ steps.stage.outputs.value }}

      # O AAB só serve para publicar na Google Play, então não é gerado em
      # pré-lançamento, onde o que interessa é um APK instalável na mão.
      - name: Compilar AAB
        if: >-
          startsWith(github.ref, 'refs/tags/v') &&
          steps.stage.outputs.prerelease == 'false'
        run: ./gradlew bundleRelease --no-daemon
        working-directory: android
        env:
          EXPO_PUBLIC_APP_STAGE: ${{ steps.stage.outputs.value }}

      - name: Renomear artefatos
        id: artifacts
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" != "push" ]; then
            VERSION="${{ steps.stage.outputs.value }}-${GITHUB_SHA::7}"
          fi
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/troqito-${VERSION}.apk"
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab \
               "dist/troqito-${VERSION}.aab"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: troqito-${{ steps.artifacts.outputs.version }}
          path: dist/*
          retention-days: 30

      - name: Publicar a versão
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ steps.stage.outputs.prerelease }}
