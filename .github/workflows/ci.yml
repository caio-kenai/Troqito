name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Formatação
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test -- --ci

  build:
    name: Validar build Android
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Instalar dependências
        run: npm ci

      - name: Gerar projeto nativo
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_APP_STAGE: preview

      # Valida que o projeto nativo compila sem exigir keystore de produção,
      # que nunca é exposto ao workflow.
      - name: Compilar variante de debug
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android
